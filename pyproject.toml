[project]
name = "wagtail-cmspage"
version = "2026.9.4"
description = "Base extensible and comprehensive CMSPage type for Wagtail"
authors = [
  { name = "David Nugent", email = "davidn@uniquode.io" }
]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "django>=5.2.16,<7.0",
    "pillow-heif >= 1.0",
    "wagtail>=8.1,<9.0",
]
requires-python = ">= 3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 8",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Private :: Do Not Upload",
]

[tool.uv]
override-dependencies = [
    "soupsieve>=4.1.0",
]

[project.urls]
repository = "https://github.com/deeprave/wagtail-cmspage"
homepage = "https://github.com/deeprave/wagtail-cmspage"

[project.optional-dependencies]
vault = [
    "hvac >= 1.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest >= 9.0",
    "pytest-django >= 4.9",
    "pytest-mock >= 3.14",
    "pytest-cov >= 7.0.0",
    "testcontainers>=4.15.0",
    "psycopg[binary]>=3.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cmspage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
